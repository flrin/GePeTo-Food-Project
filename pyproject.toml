[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gepeto"
version = "0.2.0"
description = "GePeTo - LLM-powered nutrition assistant (UBB LLM course project)"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["gepeto"]

[tool.setuptools.package-data]
gepeto = ["schema.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["model: needs a running Ollama server (set GEPETO_RUN_MODEL_TESTS=1)"]
